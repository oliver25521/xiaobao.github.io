<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>引力进化 · 羁绊纪元</title>
<style>
  :root{
    --bg:#05050a; --panel:#0d0d16d9; --line:#26263a;
    --text:#e8e8f0; --text-dim:#7a7a90;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace; color:var(--text); }
  canvas{display:block; width:100%; height:100%; cursor:none;}

  #hud{ position:fixed; top:26px; left:32px; pointer-events:none; }
  #stageName{ font-size:24px; font-weight:700; letter-spacing:.04em; transition:color .3s ease; }
  #stageSub{ font-size:10px; color:var(--text-dim); letter-spacing:.15em; text-transform:uppercase; margin-top:2px; }
  #zoneName{ font-size:11px; color:var(--text-dim); margin-top:8px; letter-spacing:.05em; }
  #zoneName b{ color:inherit; }

  #shields{ display:flex; gap:5px; margin-top:8px; }
  .shieldDot{ width:9px; height:9px; border-radius:50%; border:1.5px solid #4fff9d55; }
  .shieldDot.on{ background:#4fff9d; box-shadow:0 0 8px #4fff9d; }

  #progressWrap{ position:fixed; bottom:28px; left:32px; right:32px; display:flex; align-items:center; gap:16px; }
  #progressBar{ flex:1; height:6px; background:#1a1a28; border-radius:3px; overflow:hidden; border:1px solid var(--line); }
  #progressFill{ height:100%; width:0%; background:linear-gradient(90deg,#4f9dff,#ff4fd8); transition:width .15s ease; }
  #progLabel{ font-size:11px; color:var(--text-dim); white-space:nowrap; min-width:170px; text-align:right; }

  #absorbedCount{ position:fixed; top:30px; right:32px; text-align:right; font-size:12px; color:var(--text-dim); pointer-events:none; }
  #absorbedCount b{ display:block; font-size:22px; color:var(--text); font-weight:700; }

  #bondsPanel{
    position:fixed; bottom:64px; left:32px;
    display:flex; gap:10px; flex-wrap:wrap; max-width:420px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; backdrop-filter:blur(8px);
  }
  .bond{ display:flex; flex-direction:column; align-items:center; gap:5px; width:52px; position:relative; }
  .bondIcon{ width:12px; height:12px; border-radius:50%; }
  .bondBar{ width:100%; height:4px; background:#1a1a28; border-radius:2px; overflow:hidden; }
  .bondFill{ height:100%; width:0%; transition:width .2s ease; }
  .bondTier{ font-size:8.5px; color:var(--text-dim); letter-spacing:.03em; }
  .bondBuffed{ position:absolute; top:-6px; right:2px; font-size:9px; color:#ffd24f; }

  #centerMsg{
    position:fixed; top:42%; left:50%; transform:translate(-50%,-50%) scale(0.85);
    font-size:32px; font-weight:800; letter-spacing:.08em;
    opacity:0; pointer-events:none; text-shadow:0 0 30px currentColor;
    transition:opacity .25s ease, transform .25s ease;
  }
  #centerMsg.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  #zoneBanner{
    position:fixed; top:38%; left:50%; transform:translate(-50%,-50%);
    font-size:22px; letter-spacing:.2em; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .4s ease;
  }
  #zoneBanner .small{ display:block; font-size:11px; color:var(--text-dim); letter-spacing:.1em; margin-top:6px; }
  #zoneBanner.show{ opacity:1; }

  #warning{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:.1em; color:#ff6a6a;
    background:#1a0d0dcc; border:1px solid #ff6a6a55; border-radius:20px;
    padding:6px 16px; opacity:0; transition:opacity .3s ease; pointer-events:none;
  }
  #warning.show{ opacity:1; }

  #hint{ position:fixed; bottom:112px; left:32px; font-size:10.5px; color:var(--text-dim); opacity:0; transition:opacity .5s ease; max-width:280px; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="stageName">星尘</div>
  <div id="stageSub">STAGE 1</div>
  <div id="zoneName">当前区域 · <b id="zoneNameText">星尘回廊</b></div>
  <div id="shields"></div>
</div>

<div id="absorbedCount">已吞噬<b id="cnt">0</b></div>
<div id="warning">⚠ 掠夺者出现</div>
<div id="centerMsg">LEVEL UP</div>
<div id="zoneBanner">星尘回廊<span class="small">在屏幕边缘停留可切换区域</span></div>

<div id="bondsPanel"></div>

<div id="progressWrap">
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="progLabel">0 / 100 → 下一阶段</div>
</div>

<div id="hint">移动鼠标操控引力体 · 吞噬粒子成长 · 躲避比你大的掠夺者/吞噬比你小的 · 停留屏幕边缘切换区域 · 满级羁绊会自动触发主动技能</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
resize(); addEventListener('resize',resize);

// ---------- 进化阶段(基础7阶,之后无限延伸) ----------
const STAGES=[
  {name:'星尘',color:'#4f9dff',radius:8,absorbR:22,pull:0.55,spawnMs:220},
  {name:'陨石',color:'#6fb4ff',radius:11,absorbR:28,pull:0.65,spawnMs:190},
  {name:'小行星',color:'#8fd0ff',radius:15,absorbR:36,pull:0.78,spawnMs:160},
  {name:'矮星',color:'#ffd24f',radius:20,absorbR:46,pull:0.92,spawnMs:135},
  {name:'恒星',color:'#ff9d4f',radius:26,absorbR:58,pull:1.08,spawnMs:110},
  {name:'红巨星',color:'#ff6a4f',radius:34,absorbR:74,pull:1.28,spawnMs:90},
  {name:'黑洞',color:'#c14fff',radius:40,absorbR:95,pull:1.55,spawnMs:70},
];
function stageFor(level){
  if(level<=STAGES.length) return {...STAGES[level-1], sub:'STAGE '+level, name:STAGES[level-1].name};
  const base=STAGES[STAGES.length-1];
  const over=level-STAGES.length;
  const scale=1+over*0.16;
  return{
    name: base.name+' Lv.'+(over+1),
    color: base.color,
    radius: base.radius*scale,
    absorbR: base.absorbR*Math.min(scale,3.2),
    pull: base.pull*(1+over*0.09),
    spawnMs: Math.max(35, base.spawnMs-over*3),
    sub: 'STAGE '+level,
  };
}
// 梯度升级阈值:越往后越难
function neededFor(level){ return Math.round(100 + (level-1)*42); }

// ---------- 6种羁绊 ----------
const BONDS=[
  {key:'frost',  name:'冰', color:'#4fd8ff', desc:'减速 / 满级冰冻全场'},
  {key:'thunder',name:'雷', color:'#ffe14f', desc:'自动攻击掠夺者'},
  {key:'vortex', name:'引', color:'#b26bff', desc:'满级汇聚全图能量'},
  {key:'flame',  name:'炎', color:'#ff6a4f', desc:'范围+ / 满级灼烧'},
  {key:'life',   name:'命', color:'#4fff9d', desc:'护盾格挡'},
  {key:'wind',   name:'风', color:'#6bffe8', desc:'灵敏 / 满级残影闪避'},
];
const TIER_THRESH=[10,25,50];
function tierFor(n){ let t=0; for(const th of TIER_THRESH) if(n>=th) t++; return t; }

const bondsPanel=document.getElementById('bondsPanel');
BONDS.forEach(b=>{
  const el=document.createElement('div'); el.className='bond';
  el.innerHTML=`
    <div class="bondBuffed" id="buff-${b.key}" style="display:none">⚡</div>
    <div class="bondIcon" style="background:${b.color}"></div>
    <div class="bondBar"><div class="bondFill" id="fill-${b.key}" style="background:${b.color}"></div></div>
    <div class="bondTier" id="tier-${b.key}">${b.name} 0</div>
  `;
  bondsPanel.appendChild(el);
});

// ---------- 场景/区域系统 ----------
const ZONES=[
  {key:'nebula', name:'星尘回廊', trail:'rgba(6,6,16,0.20)', accent:'#4f9dff', predMult:1.0, powerMult:1.0, weight:{frost:1,thunder:1,vortex:1,flame:1,life:1,wind:1}},
  {key:'lava',   name:'熔岩地带', trail:'rgba(20,6,4,0.22)', accent:'#ff6a4f', predMult:1.3, powerMult:1.0, weight:{frost:0.5,thunder:1.4,vortex:0.8,flame:2.0,life:0.6,wind:0.8}},
  {key:'glacier',name:'冰川深处', trail:'rgba(4,14,20,0.22)', accent:'#4fd8ff', predMult:0.7, powerMult:0.8, weight:{frost:2.0,thunder:0.6,vortex:0.8,flame:0.5,life:1.6,wind:0.8}},
  {key:'storm',  name:'风暴之界', trail:'rgba(16,16,4,0.22)', accent:'#ffe14f', predMult:1.5, powerMult:1.1, weight:{frost:0.6,thunder:1.8,vortex:0.8,flame:0.8,life:0.6,wind:1.8}},
  {key:'void',   name:'虚空深渊', trail:'rgba(10,4,20,0.24)', accent:'#b26bff', predMult:1.4, powerMult:1.8, weight:{frost:0.8,thunder:0.8,vortex:2.0,flame:0.8,life:1.4,wind:0.6}},
];
let zoneX=0, zoneY=0;
function zoneAt(zx,zy){
  const idx = (((zx*3+zy*7)%ZONES.length)+ZONES.length)%ZONES.length;
  return ZONES[idx];
}
let currentZone = zoneAt(0,0);
document.getElementById('zoneNameText').textContent = currentZone.name;

function weightedPickBond(zone){
  let total=0;
  for(const b of BONDS) total += zone.weight[b.key];
  let r=Math.random()*total;
  for(const b of BONDS){
    r -= zone.weight[b.key];
    if(r<=0) return b;
  }
  return BONDS[0];
}

const zoneBanner=document.getElementById('zoneBanner');
function announceZone(){
  document.getElementById('zoneNameText').textContent = currentZone.name;
  zoneBanner.innerHTML = currentZone.name + '<span class="small">进入新区域 · 掠夺者强度 x'+currentZone.predMult.toFixed(1)+'</span>';
  zoneBanner.style.color = currentZone.accent;
  zoneBanner.classList.add('show');
  setTimeout(()=>zoneBanner.classList.remove('show'), 1600);
}

const edgeTimers={left:0,right:0,top:0,bottom:0};
const EDGE_MARGIN=42, EDGE_HOLD=650; // ms
function checkZoneEdge(dtMs){
  let crossed=false;
  if(player.x<EDGE_MARGIN){ edgeTimers.left+=dtMs; if(edgeTimers.left>EDGE_HOLD){ zoneX--; player.x=W-EDGE_MARGIN-20; player.tx=player.x; crossed=true; } }
  else edgeTimers.left=0;
  if(player.x>W-EDGE_MARGIN){ edgeTimers.right+=dtMs; if(edgeTimers.right>EDGE_HOLD){ zoneX++; player.x=EDGE_MARGIN+20; player.tx=player.x; crossed=true; } }
  else edgeTimers.right=0;
  if(player.y<EDGE_MARGIN){ edgeTimers.top+=dtMs; if(edgeTimers.top>EDGE_HOLD){ zoneY--; player.y=H-EDGE_MARGIN-20; player.ty=player.y; crossed=true; } }
  else edgeTimers.top=0;
  if(player.y>H-EDGE_MARGIN){ edgeTimers.bottom+=dtMs; if(edgeTimers.bottom>EDGE_HOLD){ zoneY++; player.y=EDGE_MARGIN+20; player.ty=player.y; crossed=true; } }
  else edgeTimers.bottom=0;

  if(crossed){
    currentZone = zoneAt(zoneX,zoneY);
    particles=[]; predators=[]; pickups=[];
    announceZone();
  }
}

// ---------- 玩家 ----------
const player={
  x:innerWidth/2, y:innerHeight/2, tx:innerWidth/2, ty:innerHeight/2,
  level:1, absorbed:0, totalAbsorbed:0,
  bonds:{frost:0,thunder:0,vortex:0,flame:0,life:0,wind:0},
  tempBuff:{}, // key -> expireTimestamp
  shieldMax:0, shields:0, shieldRegenTimer:0,
  dodgeMax:0, dodgeCharge:0, dodgeRegenTimer:0,
  invuln:0,
  frostLastTrigger:-99999, thunderLastTrigger:-99999, vortexLastTrigger:-99999,
};
addEventListener('mousemove', e=>{ player.tx=e.clientX; player.ty=e.clientY; });
addEventListener('touchmove', e=>{ if(e.touches[0]){ player.tx=e.touches[0].clientX; player.ty=e.touches[0].clientY; } }, {passive:true});

function tierWithBuff(key, nowT){
  const raw=tierFor(player.bonds[key]);
  const buffed = player.tempBuff[key] && player.tempBuff[key]>nowT;
  return Math.min(3, raw + (buffed?1:0));
}

function effectiveStats(nowT){
  const stage=stageFor(player.level);
  const frostT=tierWithBuff('frost',nowT);
  const thunderT=tierWithBuff('thunder',nowT);
  const vortexT=tierWithBuff('vortex',nowT);
  const flameT=tierWithBuff('flame',nowT);
  const lifeT=tierWithBuff('life',nowT);
  const windT=tierWithBuff('wind',nowT);
  return{
    stage,
    absorbR: stage.absorbR*(1+flameT*0.15),
    pull: stage.pull*(1+ (windT>0?0:0) ), // pull no longer tied to thunder now
    enemySlow: 1-frostT*0.12,
    shieldMax: lifeT,
    followSpeed: 0.11 + windT*0.03,
    hurtboxMult: 1 - windT*0.045,
    frostT, thunderT, vortexT, flameT, lifeT, windT,
  };
}

// ---------- 粒子 ----------
class Particle{
  constructor(zone){
    const edge=Math.floor(Math.random()*4);
    if(edge===0){this.x=Math.random()*W;this.y=-10;}
    else if(edge===1){this.x=W+10;this.y=Math.random()*H;}
    else if(edge===2){this.x=Math.random()*W;this.y=H+10;}
    else {this.x=-10;this.y=Math.random()*H;}
    this.vx=(Math.random()-0.5)*1.2; this.vy=(Math.random()-0.5)*1.2;
    this.type=weightedPickBond(zone);
    this.trail=[];
  }
  update(es){
    const dx=player.x-this.x, dy=player.y-this.y;
    const distSq=dx*dx+dy*dy, dist=Math.sqrt(distSq)||1;
    const force=Math.min(es.pull*900/(distSq*0.02+30)+ (900/(distSq*0.02+30))*0.55,3.4);
    this.vx+=(dx/dist)*force*0.05; this.vy+=(dy/dist)*force*0.05;
    this.vx*=0.99; this.vy*=0.99;
    this.x+=this.vx; this.y+=this.vy;
    this.trail.push({x:this.x,y:this.y}); if(this.trail.length>6) this.trail.shift();
    return dist;
  }
  draw(){
    for(let i=0;i<this.trail.length;i++){
      const p=this.trail[i], a=(i/this.trail.length)*0.35;
      ctx.fillStyle=this.type.color+Math.floor(a*255).toString(16).padStart(2,'0');
      ctx.fillRect(p.x-1,p.y-1,2,2);
    }
    ctx.beginPath(); ctx.fillStyle=this.type.color; ctx.arc(this.x,this.y,1.8,0,Math.PI*2); ctx.fill();
  }
}
let particles=[], bursts=[], pickups=[], bolts=[];
function spawnBurst(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, spd=1+Math.random()*3;
    bursts.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,color});
  }
}
let lastSpawn=0; const MAX_PARTICLES=220;

// ---------- 掠夺者 ----------
class Predator{
  constructor(elapsedMs, zone){
    const edge=Math.floor(Math.random()*4);
    if(edge===0){this.x=Math.random()*W;this.y=-30;}
    else if(edge===1){this.x=W+30;this.y=Math.random()*H;}
    else if(edge===2){this.x=Math.random()*W;this.y=H+30;}
    else {this.x=-30;this.y=Math.random()*H;}
    const minutes=elapsedMs/60000;
    const sizeRoll=Math.random();
    this.radius = (10 + sizeRoll*22 + minutes*2.0) * (0.85+Math.random()*0.3);
    this.vx=0; this.vy=0;
    // 体型越大移动越慢
    this.baseSpeed = Math.max(0.3, Math.min(1.7, 1.9 - this.radius*0.016));
    this.hue=350+Math.random()*10;
    this.frozenUntil=0;
  }
  update(es, nowT){
    if(nowT<this.frozenUntil){ return Math.hypot(player.x-this.x,player.y-this.y); }
    const dx=player.x-this.x, dy=player.y-this.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const sp=this.baseSpeed*es.enemySlow;
    this.vx += (dx/dist)*sp*0.04; this.vy += (dy/dist)*sp*0.04;
    this.vx*=0.98; this.vy*=0.98;
    this.x+=this.vx; this.y+=this.vy;
    return dist;
  }
  draw(nowT){
    const frozen = nowT<this.frozenUntil;
    ctx.beginPath();
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.radius*1.8);
    const hue = frozen?190:this.hue;
    grad.addColorStop(0,`hsla(${hue},80%,55%,0.35)`);
    grad.addColorStop(1,`hsla(${hue},80%,55%,0)`);
    ctx.fillStyle=grad; ctx.arc(this.x,this.y,this.radius*1.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.fillStyle=`hsl(${hue},75%,45%)`;
    ctx.strokeStyle=`hsl(${hue},90%,70%)`;
    ctx.lineWidth=2;
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
}
let predators=[], lastPredatorSpawn=0, predatorInterval=7000;
const MAX_PREDATORS=6;

function maybeDropPickup(x,y){
  if(Math.random() < 0.10*currentZone.powerMult){
    const b=BONDS[Math.floor(Math.random()*BONDS.length)];
    pickups.push({x,y,key:b.key,color:b.color,name:b.name,born:performance.now()});
  }
}

// ---------- UI refs ----------
const stageNameEl=document.getElementById('stageName'), stageSubEl=document.getElementById('stageSub');
const cntEl=document.getElementById('cnt'), progFill=document.getElementById('progressFill'), progLabel=document.getElementById('progLabel');
const centerMsg=document.getElementById('centerMsg'), warningEl=document.getElementById('warning'), shieldsEl=document.getElementById('shields');
const hintEl=document.getElementById('hint');
setTimeout(()=>hintEl.style.opacity=1,600); setTimeout(()=>hintEl.style.opacity=0,6000);

function showCenterMsg(text,color){
  centerMsg.textContent=text; centerMsg.style.color=color;
  centerMsg.classList.add('show'); setTimeout(()=>centerMsg.classList.remove('show'),850);
}
function showWarning(){ warningEl.classList.add('show'); setTimeout(()=>warningEl.classList.remove('show'),1400); }

function updateHUD(nowT){
  const es=effectiveStats(nowT);
  stageNameEl.textContent=es.stage.name; stageNameEl.style.color=es.stage.color;
  stageSubEl.textContent=es.stage.sub;
  cntEl.textContent=player.totalAbsorbed;
  const needed=neededFor(player.level);
  const pct=Math.min(100,(player.absorbed/needed)*100);
  progFill.style.width=pct+'%';
  progLabel.textContent=`${player.absorbed} / ${needed} → 下一阶段`;

  BONDS.forEach(b=>{
    const n=player.bonds[b.key], tier=tierFor(n);
    const nextThresh=TIER_THRESH[tier]||TIER_THRESH[TIER_THRESH.length-1];
    const prevThresh=tier>0?TIER_THRESH[tier-1]:0;
    const pct2 = tier>=3?100:((n-prevThresh)/(nextThresh-prevThresh))*100;
    document.getElementById('fill-'+b.key).style.width=pct2+'%';
    document.getElementById('tier-'+b.key).textContent = tier>0?`${b.name} Lv${tier}`:`${b.name} ${n}`;
    document.getElementById('tier-'+b.key).style.color = tier>0?b.color:'var(--text-dim)';
    const buffEl=document.getElementById('buff-'+b.key);
    buffEl.style.display = (player.tempBuff[b.key] && player.tempBuff[b.key]>nowT) ? 'block' : 'none';
  });

  player.shieldMax=es.shieldMax;
  if(player.shields>player.shieldMax) player.shields=player.shieldMax;
  shieldsEl.innerHTML='';
  for(let i=0;i<player.shieldMax;i++){
    const d=document.createElement('div'); d.className='shieldDot'+(i<player.shields?' on':'');
    shieldsEl.appendChild(d);
  }
}

function levelUp(){
  player.level++; player.absorbed=0;
  const es=effectiveStats(performance.now());
  showCenterMsg('LEVEL UP · '+es.stage.name, es.stage.color);
  spawnBurst(player.x,player.y,es.stage.color,18);
}

function absorbParticle(p){
  spawnBurst(p.x,p.y,p.type.color);
  player.bonds[p.type.key]++;
  player.absorbed++; player.totalAbsorbed++;
  const needed=neededFor(player.level);
  if(player.absorbed>=needed) levelUp();
}

function onHitByPredator(pred, nowT){
  if(player.invuln>0) return;
  if(player.dodgeCharge>0){
    player.dodgeCharge--; player.invuln=0.8;
    spawnBurst(player.x,player.y,'#6bffe8',18);
    showCenterMsg('残影闪避','#6bffe8');
    return;
  }
  if(player.shields>0){
    player.shields--; player.invuln=1.0;
    spawnBurst(player.x,player.y,'#4fff9d',16);
    showCenterMsg('护盾格挡','#4fff9d');
  }else{
    player.invuln=1.4;
    const loss=Math.min(40, player.totalAbsorbed);
    player.totalAbsorbed-=loss; player.absorbed=Math.max(0,player.absorbed-loss);
    spawnBurst(player.x,player.y,'#ff4f4f',20);
    showCenterMsg('- '+loss,'#ff4f4f');
  }
}

function devourPredator(pred){
  spawnBurst(pred.x,pred.y,'#ffffff',24);
  const needed=neededFor(player.level);
  player.totalAbsorbed+=25; player.absorbed+=25;
  if(player.absorbed>=needed) levelUp();
  showCenterMsg('吞噬掠夺者 +25', stageFor(player.level).color);
  maybeDropPickup(pred.x,pred.y);
}
function killPredatorBySkill(pred, reward){
  spawnBurst(pred.x,pred.y,'#ffe14f',16);
  player.totalAbsorbed+=reward; player.absorbed+=reward;
  const needed=neededFor(player.level);
  if(player.absorbed>=needed) levelUp();
  maybeDropPickup(pred.x,pred.y);
}

// ---------- 主循环 ----------
let startTime=null, lastT=null;
function animate(t){
  if(startTime===null){ startTime=t; lastT=t; }
  const dtMs=t-lastT; lastT=t;
  const elapsed=t-startTime;

  ctx.fillStyle=currentZone.trail;
  ctx.fillRect(0,0,W,H);

  const es=effectiveStats(t);

  // 玩家移动
  player.x+=(player.tx-player.x)*es.followSpeed;
  player.y+=(player.ty-player.y)*es.followSpeed;
  if(player.invuln>0) player.invuln-=dtMs/1000;

  checkZoneEdge(dtMs);

  // 护盾/闪避回充
  player.shieldRegenTimer+=dtMs/1000;
  if(player.shieldRegenTimer>9 && player.shields<player.shieldMax){ player.shields++; player.shieldRegenTimer=0; }
  player.dodgeMax = es.windT>=3 ? 1 : 0;
  if(player.dodgeCharge>player.dodgeMax) player.dodgeCharge=player.dodgeMax;
  player.dodgeRegenTimer+=dtMs/1000;
  if(player.dodgeRegenTimer>16 && player.dodgeCharge<player.dodgeMax){ player.dodgeCharge++; player.dodgeRegenTimer=0; }

  // 冰羁绊主动:满级定身
  if(es.frostT>=3 && t-player.frostLastTrigger>15000){
    player.frostLastTrigger=t;
    predators.forEach(p=>p.frozenUntil=t+3000);
    spawnBurst(player.x,player.y,'#4fd8ff',30);
    showCenterMsg('冰封新星','#4fd8ff');
  }
  // 雷羁绊主动:自动攻击
  if(es.thunderT>=1){
    const cd=Math.max(1400, 5000-es.thunderT*1300);
    if(t-player.thunderLastTrigger>cd && predators.length>0){
      let nearest=null, nd=Infinity;
      for(const p of predators){
        const d=Math.hypot(p.x-player.x,p.y-player.y);
        if(d<620 && d<nd){ nd=d; nearest=p; }
      }
      if(nearest){
        player.thunderLastTrigger=t;
        bolts.push({x1:player.x,y1:player.y,x2:nearest.x,y2:nearest.y,life:1});
        nearest.radius*=0.55;
        if(nearest.radius<9){
          killPredatorBySkill(nearest,12);
          predators.splice(predators.indexOf(nearest),1);
        }
      }
    }
  }
  // 引羁绊主动:汇聚全图
  if(es.vortexT>=3){
    const cd=Math.max(7000, 16000-es.vortexT*0);
    if(t-player.vortexLastTrigger>10000){
      player.vortexLastTrigger=t;
      spawnBurst(player.x,player.y,'#b26bff',26);
      showCenterMsg('能量汇聚','#b26bff');
      for(const p of particles) absorbParticle(p);
      particles=[];
    }
  }
  // 炎羁绊满级:灼烧周围掠夺者
  if(es.flameT>=3){
    for(let i=predators.length-1;i>=0;i--){
      const pr=predators[i];
      const d=Math.hypot(pr.x-player.x,pr.y-player.y);
      if(d<es.absorbR*3){
        pr.radius-=0.06;
        if(pr.radius<9){ killPredatorBySkill(pr,10); predators.splice(i,1); }
      }
    }
  }

  // 生成粒子
  if(t-lastSpawn>es.stage.spawnMs && particles.length<MAX_PARTICLES){
    particles.push(new Particle(currentZone)); lastSpawn=t;
  }
  // 生成掠夺者
  if(t-lastPredatorSpawn>predatorInterval && predators.length<MAX_PREDATORS){
    predators.push(new Predator(elapsed, currentZone));
    lastPredatorSpawn=t;
    predatorInterval=Math.max(2800,(7000-elapsed/2200)/currentZone.predMult);
    showWarning();
  }

  // 粒子更新
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; const dist=p.update(es);
    if(dist<es.absorbR){ absorbParticle(p); particles.splice(i,1); continue; }
    p.draw();
  }

  // 掠夺者更新+碰撞
  const stageR=es.stage.radius*es.hurtboxMult;
  for(let i=predators.length-1;i>=0;i--){
    const pr=predators[i]; const dist=pr.update(es,t);
    if(dist < pr.radius+stageR){
      if(stageR>=pr.radius){ devourPredator(pr); predators.splice(i,1); continue; }
      else{ onHitByPredator(pr,t); predators.splice(i,1); continue; }
    }
    if(pr.x<-250||pr.x>W+250||pr.y<-250||pr.y>H+250){ predators.splice(i,1); continue; }
    pr.draw(t);
  }

  // 拾取物
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    if(t-pk.born>10000){ pickups.splice(i,1); continue; }
    const d=Math.hypot(pk.x-player.x,pk.y-player.y);
    if(d<es.absorbR+14){
      player.tempBuff[pk.key]=t+12000;
      spawnBurst(pk.x,pk.y,pk.color,20);
      showCenterMsg(pk.name+' 强化 +1','#ffd24f');
      pickups.splice(i,1); continue;
    }
    const pulse=1+Math.sin(t/150)*0.25;
    ctx.save();
    ctx.translate(pk.x,pk.y); ctx.rotate(t/500);
    ctx.beginPath();
    ctx.fillStyle=pk.color; ctx.shadowColor=pk.color; ctx.shadowBlur=14;
    const s=7*pulse;
    ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 闪电特效
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i]; b.life-=0.09;
    if(b.life<=0){ bolts.splice(i,1); continue; }
    ctx.beginPath();
    ctx.strokeStyle=`rgba(255,225,79,${b.life})`;
    ctx.lineWidth=2;
    ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
  }

  // 爆裂粒子
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i]; b.x+=b.vx; b.y+=b.vy; b.life-=0.035;
    if(b.life<=0){ bursts.splice(i,1); continue; }
    ctx.beginPath();
    ctx.fillStyle=b.color+Math.floor(b.life*255).toString(16).padStart(2,'0');
    ctx.arc(b.x,b.y,2*b.life,0,Math.PI*2); ctx.fill();
  }

  // 玩家绘制
  const pulse=1+Math.sin(t/300)*0.08;
  const blink = player.invuln>0 ? (Math.sin(t/60)>0?0.4:1) : 1;
  const grad=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,es.absorbR*1.6);
  grad.addColorStop(0, es.stage.color+'55'); grad.addColorStop(1, es.stage.color+'00');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(player.x,player.y,es.absorbR*1.6,0,Math.PI*2); ctx.fill();

  ctx.globalAlpha=blink;
  ctx.beginPath(); ctx.fillStyle=es.stage.color;
  ctx.shadowColor=es.stage.color; ctx.shadowBlur=18;
  ctx.arc(player.x,player.y,es.stage.radius*pulse,0,Math.PI*2);
  ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;

  if(player.level>=6){
    ctx.beginPath(); ctx.strokeStyle=es.stage.color+'88'; ctx.lineWidth=2;
    ctx.ellipse(player.x,player.y,es.stage.radius*2.2,es.stage.radius*0.7,t/2000,0,Math.PI*2);
    ctx.stroke();
  }

  updateHUD(t);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
